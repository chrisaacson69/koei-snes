# KOEI SNES engine — per-title profiles. The bytecode VM is shared across titles;
# only these addresses move (the engine is relocated/reassembled per game). Add a
# block per title; the tools take --game <name> (default: first/only entry).
#
# Discover a new title's constants with the snes-decompiler + koei-snes tools:
#   header/mapping        -> snes-decompiler/tools/header_parse.py
#   $00:8000 ABI table    -> disasm the 4 JMPs before RESET
#   interpreter_loop      -> the $9A8F-style fetch: LDA [$06]/INC $06/JMP (table,X)
#   primary/extended tbl  -> the table the loop indexes (256 entries) + the $B7 target
#   syscall_table         -> JSR ($xxxx,X) after the 22-byte param-block copy
#   fetch_helpers         -> the subs each doing LDA [$06] + INC $06 (1 or 2 bytes)

[rot3k2]
title        = "Romance of the Three Kingdoms II (USA)"
mapping      = "lorom"
rom_bytes    = 1048576
reset        = 0x800C
abi_table    = 0x8000        # 4 JMP trampolines: run-VM / syscall / ext-op x2
interpreter_loop  = 0x9A8F   # main fetch-decode-dispatch
ext_interpreter   = 0xA2E6   # $B7 prefix lands here
primary_table     = 0xA0E6   # 256 entries ($A0E6..$A2E5)
extended_table    = 0xA2FE   # 48 entries (32-bit math)
extended_prefix   = 0xB7
invalid_handler   = 0xA082   # shared nop/invalid (38 unused opcodes -> 218 real)
syscall_table     = 0x937B   # 69 entries
syscall_count     = 69
syscall_dispatch  = 0x8C1D
run_vm_entry      = 0x9A4C
resource_archive  = 0xF800   # named-blob directory (root/comroot/excsub/...)
# WRAM overlay map (module header = JMP base+3). Overlays share a slot (one at a time).
# root=$7E:2000 resident; comroot(AI)/settei/kisetsu=$7E:7200; excsub1-6=$7E:C300;
# cbmdata1=$7E:0000. 11 modules, ~1965 routines total. See rot3k2-snes docs/09-modules.md.
module_bases = { root = 0x2000, comroot = 0x7200, settei = 0x7200, kisetsu = 0x7200, cbmdata1 = 0x0000, excsub = 0xC300 }
loader            = 0x9636   # cross-bank block copy -> WRAM (self-mod MVN at $006C)
code_span         = [0x800C, 0xB20A]   # native engine extent (rest of bank $00 = data)
# operand-fetch helpers -> bytes each pulls from the bytecode PC ($06)
fetch_helpers = { 0xA089 = 1, 0xA09B = 1, 0xA0BC = 2, 0xA0C4 = 2, 0xA0CE = 2 }
# Per-routine native trampoline (same convention as gemfire; discovered via the cross-title
# compare): each bytecode routine is prefixed by `JSR $23E6` + a 2-byte param, body at +5.
# (The original rot3k2 walk used offset 0, decoding the 5-byte trampoline as bytecode.)
routine_sig         = [0x20, 0xE6, 0x23]   # JSR $23E6 (the rot3k2 module-launcher trampoline)
routine_body_offset = 5

[gemfire]
# 2nd KOEI SNES title. Every constant below was derived FRESH from the Gemfire ROM
# (never copied from rot3k2/NES-Gemfire); prior projects are held as post-hoc oracles.
title        = "Gemfire (USA)"
mapping      = "lorom"
rom_bytes    = 1048576
reset        = 0x800F        # +3 vs rot3k2 ($800C): abi_table has 5 JMPs here, not 4
abi_table    = 0x8000        # 5 JMP trampolines ($8000/$8003 ext, $8006/$8009 -> $AB96, $800C -> $8E8B)
interpreter_loop  = 0xA340   # main fetch: SEP; LDA [$06],Y; REP; INC $06; index $A996; JMP ($00)
primary_table     = 0xA996   # 256 entries ($A996..$AB95)
invalid_handler   = 0xA932   # modal x38 -> 218 real opcodes (matches rot3k2's 218; oracle-pending)
extended_prefix   = 0xB7     # the only primary opcode whose handler is $AB96
ext_interpreter   = 0xAB96   # $B7 lands here; reads next bytecode byte, indexes $ABAE
extended_table    = 0xABAE   # 48 entries ($ABAE..$AC0D); handlers begin $AC0E
# op$00-$0F = ldA frame[n] (verified: $A35B stub loads a negative frame offset, common $A395 = regA=*(frame+off));
# opcodes are byte-identical to the shared VM -> koei-snes/data/vm_opcode_names.toml applies directly.
syscall_table     = 0x9A82   # 82 entries ($9A82..$9B25); break at sys$52 -> $2000 (WRAM)
syscall_count     = 82       # (rot3k2 had 69 — Gemfire genuinely has more; derived here)
syscall_dispatch  = 0x8E64   # LDA $0052 (syscall#) / ASL / JSR ($9A82,X); twin wrapper $8E8B
resource_archive  = 0xF800   # 16-byte dir entries: 8-char name + slot-byte + src/size
run_vm_entry      = 0xA340   # coincides with the loop entry (no separate setup trampoline like rot3k2's $9A4C);
                             # modules invoke bytecode via the $8006 ABI -> $AB96, then run in $A340
loader            = 0x9B64   # archive name-search (walks $F800 16-byte entries); block copy at $9D14/$9D57
code_span         = [0x800F, 0xBB93]   # native_floor reachability walk: 6414 insns, code ends $BB93 (above = data)
# Module overlay slots (from the archive slot-byte). Gemfire's own module set:
#   1: root, bdata, bg_map        2: open        3: settei, event, command
#   4: comusr1, comusr2, comcmp, ending          5: senzen, sensou, sengo
#   6: sntanm1..sntanm5, sendisp
# root confirmed resident at WRAM $7E:2000 (boot JML [$809C]=$7E2000). Rest pending per-module walk.
module_bases = { root = 0x2000 }
# operand-fetch helpers (just below primary_table, as in rot3k2): bytes each pulls from PC ($06)
fetch_helpers = { 0xA93E = 1, 0xA96C = 2, 0xA974 = 2 }
# Per-routine native trampoline: each bytecode routine is prefixed by `JSR $3287` + a 2-byte
# param, so a call target ($AC/$E9) points at the trampoline and the bytecode BODY is at +5.
# (rot3k2 default = sig [0x20,0xE6], offset 0.) See docs/00-recon.md.
routine_sig         = [0x20, 0x87, 0x32]   # JSR $3287 (the $3287 module-launcher trampoline)
routine_body_offset = 5                    # JSR(3) + 2-byte inline param -> body

[aerobiz]
# 3rd KOEI SNES title: Aerobiz (USA) -- the ORIGINAL (JP Air Management: Oozora ni Kakeru, SFC 1992-04;
# never on NES/Famicom). Every constant derived FRESH from the Aerobiz ROM by the recon #1 workflow
# (7 derive families, 8 independent verifiers, 1 critic; all verified) -- AeroBiz-decompiler/docs/00-recon.md.
title        = "Aerobiz (USA)"
mapping      = "lorom"
rom_bytes    = 1048576
reset        = 0x800C        # same as rot3k2 (4 ABI JMPs)
abi_table    = 0x8000        # $8000->$A29B run-VM, $8003->$A277 syscall, $8006/$8009->$AB35 ext (unreferenced)
interpreter_loop  = 0xA2DF   # loop HEAD (gemfire convention); $A2DE = PLB tail of run_vm_entry
primary_table     = 0xA935   # 256 entries ($A935..$AB34), 162 distinct handlers
invalid_handler   = 0xA8D1   # BRK stub x38 (80, 91-9F, B2, CE, EB-FE); op $FF -> $A8D3 (+2, also BRK) -> 217 live
extended_prefix   = 0xB7
ext_interpreter   = 0xAB35   # pushes #$A2DE so ext handlers RTS to the loop head
extended_table    = 0xAB4D   # 48 words ($AB4D..$ABAC); ext[0]=$0000 null (BRK); 47 live $01-$2F; bytes >= $30 invalid
syscall_table     = 0x9753   # 99 entries ($00-$62), 98 distinct ($0D=$0E); ends at mask table $9819
syscall_count     = 99
syscall_dispatch  = 0x8D23   # id = $52 & $FF; JSR ($9753,X) at $8D46 (+ Aerobiz-only CMP #$0F / STA $6D)
run_vm_entry      = 0xA29B   # routine prologue: frame from trampoline word, PC = tramp+5 (= rot3k2 $9A4C / gemfire $A2FC)
resource_archive  = 0xF000   # 223 rows [name8][bank u16][addr u16][len u32], zero row at $FDF0 (NOT $F800 = row 128)
loader            = 0x983D   # sys $18 res_open = name search over $F000 (gemfire meaning); copy $9A39 -> DMA ch5 $9AD2
code_span         = [0x800C, 0xD085]   # recon preview (native_floor with scratch profile): 8,820 insns
module_bases = { COMMON = 0x1000, ALNMAIN = 0x2000, START = 0x9000, OPENING = 0x9000, RENEWAL = 0x9000, JUDGMENT = 0x9000, ENDING = 0x9000, COMMAND = 0x8C00, DIORAMA = 0xC100, AIRWAY = 0xD000, OPERATE = 0xD000, INFORM = 0xD000, TRADE = 0xD000, INVEST = 0xD000, NEGO = 0xD000, CAMPAIGN = 0xD000, ALGO = 0xD000, SIMULATE = 0xD000, SYSTEM = 0xD000, REPORT = 0xD000, DEMAND = 0xD000, DIORMINF = 0xD000 }
# operand-fetch helpers: $A8D8 s8 imm; $A8EA s8 frame-rel addr->$00; $A90B imm16; $A913 a16->$00; $A91D s16 frame-rel
fetch_helpers = { 0xA8D8 = 1, 0xA8EA = 1, 0xA90B = 2, 0xA913 = 2, 0xA91D = 2 }
# Per-routine trampoline: JSR $1C10 (COMMON's JSL $008000 stub) + signed frame-size word; body at +5. 479 routines.
routine_sig         = [0x20, 0x10, 0x1C]
routine_body_offset = 5
